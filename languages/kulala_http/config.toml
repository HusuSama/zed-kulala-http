name = "kulala-http"
grammar = "kulala_http"
path_suffixes = ["http", "kulala"]
autoclose_before = ";:.,=})"

brackets = [
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
]
